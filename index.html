<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamTek Project Management Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-microchip text-indigo-400 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">StreamTek Project Spec & Task Manager</h1>
            </div>
            <button onclick="openProjectModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow">
                <i class="fa-solid fa-plus"></i> 新增專案 (New Project)
            </button>
        </div>
    </header>

    <!-- Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 space-y-6">

        <!-- Project Selector & Dashboard Summary -->
        <section class="bg-white rounded-xl shadow p-5 border border-slate-200">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">目前檢視的專案 (Current Project)</label>
                    <div class="flex items-center gap-3">
                        <select id="projectSelect" onchange="switchProject()" class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-800 font-semibold focus:ring-2 focus:ring-indigo-500 min-w-[240px]">
                            <!-- Dynamic Options -->
                        </select>
                        <button onclick="viewCurrentProjectSpec()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-md font-medium border border-slate-300 transition">
                            <i class="fa-solid fa-file-lines mr-1"></i> 查看 Spec 規格
                        </button>
                    </div>
                </div>

                <!-- Stats -->
                <div class="flex items-center gap-4 text-center">
                    <div class="px-4 py-2 bg-slate-50 rounded-lg border border-slate-100">
                        <p class="text-xs text-slate-500">待處理</p>
                        <p id="statTodo" class="text-lg font-bold text-slate-700">0</p>
                    </div>
                    <div class="px-4 py-2 bg-slate-50 rounded-lg border border-slate-100">
                        <p class="text-xs text-slate-500">進行中</p>
                        <p id="statInProgress" class="text-lg font-bold text-amber-600">0</p>
                    </div>
                    <div class="px-4 py-2 bg-slate-50 rounded-lg border border-slate-100">
                        <p class="text-xs text-slate-500">已完成</p>
                        <p id="statDone" class="text-lg font-bold text-emerald-600">0</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Kanban Board -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- To Do -->
            <div class="bg-slate-200/60 rounded-xl p-4 border border-slate-200 flex flex-col min-h-[500px]">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-slate-700 flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span> 待處理 (To Do)
                    </h3>
                    <button onclick="openTaskModal('todo')" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">+ 加任務</button>
                </div>
                <div id="column-todo" class="space-y-3 flex-grow" ondragover="allowDrop(event)" ondrop="drop(event, 'todo')"></div>
            </div>

            <!-- In Progress -->
            <div class="bg-amber-50/60 rounded-xl p-4 border border-amber-200/60 flex flex-col min-h-[500px]">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-amber-800 flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> 進行中 (In Progress)
                    </h3>
                    <button onclick="openTaskModal('in_progress')" class="text-xs text-amber-700 hover:text-amber-900 font-medium">+ 加任務</button>
                </div>
                <div id="column-in_progress" class="space-y-3 flex-grow" ondragover="allowDrop(event)" ondrop="drop(event, 'in_progress')"></div>
            </div>

            <!-- Done -->
            <div class="bg-emerald-50/60 rounded-xl p-4 border border-emerald-200/60 flex flex-col min-h-[500px]">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-emerald-800 flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 已完成 (Completed)
                    </h3>
                    <button onclick="openTaskModal('done')" class="text-xs text-emerald-700 hover:text-emerald-900 font-medium">+ 加任務</button>
                </div>
                <div id="column-done" class="space-y-3 flex-grow" ondragover="allowDrop(event)" ondrop="drop(event, 'done')"></div>
            </div>
        </section>
    </main>

    <!-- MODAL 1: Create New Project Spec -->
    <div id="projectModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-lg text-slate-800">建立新專案 Spec (New Project Specification)</h3>
                <button onclick="closeProjectModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="projectForm" onsubmit="handleSaveProject(event)" class="p-6 space-y-4 overflow-y-auto flex-grow">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">專案名稱 (Project Name) *</label>
                    <input type="text" id="projName" required placeholder="例如: DAB Radio TableTop Gen2" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">選擇專案晶片規格類別 (Project Category) *</label>
                    <select id="projCategory" onchange="renderSpecFields()" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 bg-slate-50 font-medium">
                        <option value="Siena">Siena (DAB/DAB+ Receiver)</option>
                        <option value="Venice-X">Venice-X (Connected Audio / Smart Radio)</option>
                        <option value="Auria">Auria (GUI & Advanced Smart Streaming)</option>
                    </select>
                </div>

                <hr class="my-4 border-slate-200">

                <!-- Dynamic Form Container based on selected PDF Spec -->
                <div id="dynamicSpecFields" class="space-y-4"></div>

                <div class="pt-4 flex justify-end gap-3">
                    <button type="button" onclick="closeProjectModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">取消</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-500 shadow">建立專案</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL 2: Create New Task -->
    <div id="taskModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
            <h3 class="font-bold text-lg text-slate-800">新增任務 (Add Task)</h3>
            <form onsubmit="handleSaveTask(event)" class="space-y-3">
                <input type="hidden" id="taskStatusTarget">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">任務名稱 *</label>
                    <input type="text" id="taskTitle" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">詳細說明</label>
                    <textarea id="taskDesc" rows="2" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">優先級</label>
                        <select id="taskPriority" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                            <option value="Low">低 (Low)</option>
                            <option value="Medium" selected>中 (Medium)</option>
                            <option value="High">高 (High)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">到期日</label>
                        <input type="date" id="taskDueDate" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                </div>
                <div class="pt-3 flex justify-end gap-2">
                    <button type="button" onclick="closeTaskModal()" class="px-3 py-1.5 border border-slate-300 rounded-lg text-xs font-medium text-slate-600">取消</button>
                    <button type="submit" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-medium hover:bg-indigo-500">新增</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL 3: View Project Spec Detail -->
    <div id="specDetailModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full max-h-[85vh] flex flex-col overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-900 text-white">
                <div>
                    <h3 id="specDetailTitle" class="font-bold text-lg"></h3>
                    <p id="specDetailCategory" class="text-xs text-indigo-300"></p>
                </div>
                <button onclick="closeSpecDetailModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="specDetailContent" class="p-6 overflow-y-auto space-y-4 text-sm">
                <!-- Spec key-values injected here -->
            </div>
        </div>
    </div>

    <script>
        // Default LocalStorage Key
        const STORAGE_KEY = 'STREAMTEK_PROJECTS_DATA_V1';

        // State Data
        let appData = {
            projects: [
                {
                    id: 'proj-default-1',
                    name: 'Demo Siena Radio Project',
                    category: 'Siena',
                    spec: {
                        hwCode: 'HA-FS2415-000007',
                        swCode: 'SW-SIENA-V1',
                        brand: 'StreamTek',
                        brandModel: 'ST-DAB-01',
                        productClass: 'Table Top Radio',
                        broadcast: ['DAB', 'DAB+', 'FM RDS'],
                        features: ['Color Display', 'Internal EQ'],
                        powerSupply: 'Single Supply 3.3V only'
                    },
                    tasks: [
                        { id: 't1', title: '硬體電路板 Layout 確認', desc: '確認 Siena 晶片 3.3V 供電路徑', priority: 'High', dueDate: '2026-11-20', status: 'todo' },
                        { id: 't2', title: 'DAB 天線收訊效能測試', desc: '進行廣播訊號衰減與感度分析', priority: 'Medium', dueDate: '2026-11-25', status: 'in_progress' }
                    ]
                }
            ],
            currentProjectId: 'proj-default-1'
        };

        // Init
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderProjectSelect();
            renderSpecFields();
            renderTasks();
        });

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        }

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try { appData = JSON.parse(saved); } catch(e) { console.error(e); }
            }
        }

        function getCurrentProject() {
            return appData.projects.find(p => p.id === appData.currentProjectId) || appData.projects[0];
        }

        function renderProjectSelect() {
            const select = document.getElementById('projectSelect');
            select.innerHTML = appData.projects.map(p => 
                `<option value="${p.id}" ${p.id === appData.currentProjectId ? 'selected' : ''}>[${p.category}] ${p.name}</option>`
            ).join('');
        }

        function switchProject() {
            appData.currentProjectId = document.getElementById('projectSelect').value;
            saveData();
            renderTasks();
        }

        // Render Dynamic Form Fields Based on Selected Category
        function renderSpecFields() {
            const cat = document.getElementById('projCategory').value;
            const container = document.getElementById('dynamicSpecFields');
            
            let html = `
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Hardware Code</label>
                        <input type="text" name="hwCode" placeholder="HA-FSXXXX-XXXXXX" class="w-full border border-slate-300 rounded p-2 text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Software Code</label>
                        <input type="text" name="swCode" placeholder="SW-XXXX" class="w-full border border-slate-300 rounded p-2 text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Brand / Owner</label>
                        <input type="text" name="brand" placeholder="Brand Name" class="w-full border border-slate-300 rounded p-2 text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Brand Model Number</label>
                        <input type="text" name="brandModel" placeholder="Model No." class="w-full border border-slate-300 rounded p-2 text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">OEM / OEM Model</label>
                        <input type="text" name="oem" placeholder="OEM Info" class="w-full border border-slate-300 rounded p-2 text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Product Class</label>
                        <select name="productClass" class="w-full border border-slate-300 rounded p-2 text-xs">
                            <option>Table Top</option>
                            <option>Kitchen Radio</option>
                            <option>Clock Radio</option>
                            <option>Portable Radio</option>
                        </select>
                    </div>
                </div>
            `;

            if (cat === 'Siena') {
                html += `
                    <div class="space-y-2 bg-slate-50 p-3 rounded-lg border border-slate-200">
                        <p class="text-xs font-bold text-slate-700">Siena Specific Options</p>
                        <div>
                            <span class="block text-xs font-medium text-slate-600 mb-1">Broadcast Radio:</span>
                            <div class="flex gap-4 text-xs">
                                <label><input type="checkbox" name="broadcast" value="DAB" checked> DAB</label>
                                <label><input type="checkbox" name="broadcast" value="DAB+" checked> DAB+</label>
                                <label><input type="checkbox" name="broadcast" value="FM RDS" checked> FM RDS</label>
                            </div>
                        </div>
                        <div>
                            <span class="block text-xs font-medium text-slate-600 mb-1">Power Supply:</span>
                            <div class="flex gap-4 text-xs">
                                <label><input type="radio" name="powerSupply" value="Single Supply 3.3V" checked> Single 3.3V</label>
                                <label><input type="radio" name="powerSupply" value="Separated Supply (3.3V, 1.8V, 1.1V)"> Separated (3.3V, 1.8V, 1.1V)</label>
                            </div>
                        </div>
                        <div>
                            <span class="block text-xs font-medium text-slate-600 mb-1">Additional Features:</span>
                            <div class="grid grid-cols-3 gap-2 text-xs">
                                <label><input type="checkbox" name="features" value="USB DFU"> USB DFU</label>
                                <label><input type="checkbox" name="features" value="Color Display"> Color Display</label>
                                <label><input type="checkbox" name="features" value="Internal EQ"> Internal EQ</label>
                                <label><input type="checkbox" name="features" value="I2S Output"> I2S Output</label>
                                <label><input type="checkbox" name="features" value="NFC"> NFC</label>
                            </div>
                        </div>
                    </div>
                `;
            } else if (cat === 'Venice-X') {
                html += `
                    <div class="space-y-2 bg-amber-50/50 p-3 rounded-lg border border-amber-200">
                        <p class="text-xs font-bold text-amber-800">Venice-X Specific Options</p>
                        <div>
                            <span class="block text-xs font-medium text-slate-600 mb-1">Internet Content & Streaming:</span>
                            <div class="grid grid-cols-3 gap-2 text-xs">
                                <label><input type="checkbox" name="internetContent" value="IR Airable"> IR Airable</label>
                                <label><input type="checkbox" name="internetContent" value="Spotify"> Spotify</label>
                                <label><input type="checkbox" name="internetContent" value="Amazon Music"> Amazon Music</label>
                                <label><input type="checkbox" name="internetContent" value="Deezer"> Deezer</label>
                                <label><input type="checkbox" name="internetContent" value="TIDAL"> TIDAL</label>
                                <label><input type="checkbox" name="internetContent" value="Qobuz"> Qobuz</label>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div>
                                <span class="font-medium">WiFi Antenna:</span>
                                <select name="wifiAntenna" class="w-full border rounded p-1 text-xs">
                                    <option>Single Int. PIFA</option>
                                    <option>Single Ext. - J5</option>
                                    <option>Diversity PIFA+J5</option>
                                    <option>Diversity J4+J5</option>
                                </select>
                            </div>
                            <div>
                                <span class="font-medium">Mobile App Support:</span>
                                <select name="mobileApp" class="w-full border rounded p-1 text-xs">
                                    <option>UNDOK</option>
                                    <option>Customized UNDOK</option>
                                    <option>None</option>
                                </select>
                            </div>
                        </div>
                    </div>
                `;
            } else if (cat === 'Auria') {
                html += `
                    <div class="space-y-2 bg-indigo-50/50 p-3 rounded-lg border border-indigo-200">
                        <p class="text-xs font-bold text-indigo-800">Auria GUI & Advanced Audio Options</p>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div>
                                <span class="font-medium">Streaming options:</span>
                                <div class="space-y-1 mt-1">
                                    <label class="block"><input type="checkbox" name="auriaStreaming" value="AirPlay2"> AirPlay 2</label>
                                    <label class="block"><input type="checkbox" name="auriaStreaming" value="Spotify HiFi"> Spotify HiFi</label>
                                    <label class="block"><input type="checkbox" name="auriaStreaming" value="Tidal Connect"> Tidal Connect</label>
                                </div>
                            </div>
                            <div>
                                <span class="font-medium">Hardware Features:</span>
                                <div class="space-y-1 mt-1">
                                    <label class="block"><input type="checkbox" name="auriaHw" value="Color UI"> Color UI</label>
                                    <label class="block"><input type="checkbox" name="auriaHw" value="Build-In DAC"> Build-In DAC</label>
                                    <label class="block"><input type="checkbox" name="auriaHw" value="AMP/DSP/EQ Tuning"> AMP/DSP/EQ Tuning</label>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // Modal Controllers
        function openProjectModal() { document.getElementById('projectModal').classList.remove('hidden'); document.getElementById('projectModal').classList.add('flex'); }
        function closeProjectModal() { document.getElementById('projectModal').classList.add('hidden'); document.getElementById('projectModal').classList.remove('flex'); }

        function openTaskModal(status) {
            document.getElementById('taskStatusTarget').value = status;
            document.getElementById('taskModal').classList.remove('hidden');
            document.getElementById('taskModal').classList.add('flex');
        }
        function closeTaskModal() { document.getElementById('taskModal').classList.add('hidden'); document.getElementById('taskModal').classList.remove('flex'); }

        // Save Project
        function handleSaveProject(e) {
            e.preventDefault();
            const name = document.getElementById('projName').value;
            const category = document.getElementById('projCategory').value;
            const form = document.getElementById('projectForm');
            const formData = new FormData(form);

            const spec = {};
            formData.forEach((value, key) => {
                if (spec[key]) {
                    if (!Array.isArray(spec[key])) spec[key] = [spec[key]];
                    spec[key].push(value);
                } else {
                    spec[key] = value;
                }
            });

            const newProj = {
                id: 'proj-' + Date.now(),
                name,
                category,
                spec,
                tasks: []
            };

            appData.projects.push(newProj);
            appData.currentProjectId = newProj.id;
            saveData();

            renderProjectSelect();
            renderTasks();
            closeProjectModal();
            form.reset();
        }

        // Save Task
        function handleSaveTask(e) {
            e.preventDefault();
            const proj = getCurrentProject();
            const newTask = {
                id: 'task-' + Date.now(),
                title: document.getElementById('taskTitle').value,
                desc: document.getElementById('taskDesc').value,
                priority: document.getElementById('taskPriority').value,
                dueDate: document.getElementById('taskDueDate').value,
                status: document.getElementById('taskStatusTarget').value
            };

            proj.tasks.push(newTask);
            saveData();
            renderTasks();
            closeTaskModal();
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDesc').value = '';
        }

        // Render Tasks to Board
        function renderTasks() {
            const proj = getCurrentProject();
            const cols = { todo: [], in_progress: [], done: [] };

            proj.tasks.forEach(t => {
                if (cols[t.status]) cols[t.status].push(t);
            });

            // Update stats
            document.getElementById('statTodo').innerText = cols.todo.length;
            document.getElementById('statInProgress').innerText = cols.in_progress.length;
            document.getElementById('statDone').innerText = cols.done.length;

            // Render columns
            ['todo', 'in_progress', 'done'].forEach(status => {
                const container = document.getElementById(`column-${status}`);
                container.innerHTML = cols[status].map(t => `
                    <div draggable="true" ondragstart="drag(event, '${t.id}')" class="bg-white p-3.5 rounded-lg shadow-sm border border-slate-200 hover:shadow-md transition space-y-2">
                        <div class="flex justify-between items-start">
                            <h4 class="font-semibold text-sm text-slate-800">${t.title}</h4>
                            <button onclick="deleteTask('${t.id}')" class="text-slate-300 hover:text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button>
                        </div>
                        ${t.desc ? `<p class="text-xs text-slate-500 line-clamp-2">${t.desc}</p>` : ''}
                        <div class="flex justify-between items-center text-[10px] pt-1">
                            <span class="px-2 py-0.5 rounded ${t.priority === 'High' ? 'bg-red-100 text-red-700' : t.priority === 'Medium' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600'} font-medium">
                                ${t.priority}
                            </span>
                            ${t.dueDate ? `<span class="text-slate-400"><i class="fa-regular fa-calendar mr-1"></i>${t.dueDate}</span>` : ''}
                        </div>
                    </div>
                `).join('');
            });
        }

        // Drag & Drop
        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev, id) { ev.dataTransfer.setData("taskId", id); }
        function drop(ev, status) {
            ev.preventDefault();
            const id = ev.dataTransfer.getData("taskId");
            const proj = getCurrentProject();
            const task = proj.tasks.find(t => t.id === id);
            if (task) {
                task.status = status;
                saveData();
                renderTasks();
            }
        }

        function deleteTask(id) {
            const proj = getCurrentProject();
            proj.tasks = proj.tasks.filter(t => t.id !== id);
            saveData();
            renderTasks();
        }

        // View Spec Detail
        function viewCurrentProjectSpec() {
            const proj = getCurrentProject();
            document.getElementById('specDetailTitle').innerText = proj.name;
            document.getElementById('specDetailCategory').innerText = `Category: ${proj.category}`;
            
            let html = `<div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-2">`;
            for (const [k, v] of Object.entries(proj.spec)) {
                if (k === 'projCategory' || k === 'projName') continue;
                const displayVal = Array.isArray(v) ? v.join(', ') : (v || 'N/A');
                html += `<div class="flex justify-between border-b border-slate-200 pb-1">
                    <span class="font-medium text-slate-600 text-xs">${k}:</span>
                    <span class="font-bold text-slate-800 text-xs">${displayVal}</span>
                </div>`;
            }
            html += `</div>`;

            document.getElementById('specDetailContent').innerHTML = html;
            document.getElementById('specDetailModal').classList.remove('hidden');
            document.getElementById('specDetailModal').classList.add('flex');
        }

        function closeSpecDetailModal() {
            document.getElementById('specDetailModal').classList.add('hidden');
            document.getElementById('specDetailModal').classList.remove('flex');
        }
    </script>
</body>
</html>
